# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: <your-github-username-or-org>
#        Repository name:  <your-repo-name>
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Leave the NPM_TOKEN secret unset in this repository. GitHub's OIDC
#      token is used instead — no secret ever touches your repo settings.
#
# Option B — npm Automation Token: no longer used here, and not recommended.
#   npm is restricting tokens that bypass 2FA for direct publishing. This repo had a
#   granular NPM_TOKEN that published 0.1.1 on 22 Aug 2026 and was refused for 0.1.2
#   on 10 Sep with "404 Not Found - PUT" — npm's opaque way of saying the credential
#   is not accepted. Trusted publishing above replaces it; delete the secret once a
#   release has gone out under OIDC, so it can never shadow the exchange again.
#
# Provenance is signed by GitHub's OIDC infrastructure either way — note that the
# 0.1.2 failure signed provenance successfully *before* the registry rejected the
# write, so a signed statement in the transparency log is not proof of a publish.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run the following command locally to start an interactive release:
#
#   npm run release
#
# This will lint, build, prompt for a version bump, update the changelog,
# commit, tag, and push — which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

# The release pushes the commit and the tag in quick succession, which produced two
# Publish runs for the same tag on 0.1.2. Serialise them so two jobs never race to
# publish the same version; the loser fails on npm's version conflict, which is
# harmless. Never cancel in progress here — that could kill a publish mid-flight.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          # Required for OIDC trusted publishing: this is what writes the registry
          # into .npmrc so npm knows where to perform the token exchange. Without it
          # the publish request goes out unauthenticated and npm answers 404 on PUT.
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: 'npm ci'

      # npm's OIDC trusted publishing needs npm >= 11.5.1. `lts/*` generally ships a
      # new enough npm, but pinning it here means a runner image change can't quietly
      # drop us back to token auth.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Release
        # Authentication is OIDC trusted publishing — no NPM_TOKEN. The exchange needs
        # `id-token: write` above and `registry-url` on setup-node, and the publisher
        # must be registered on npmjs.com under this package's Trusted Publishers
        # (repository simgate-dev/n8n-nodes-simgate, workflow publish.yml).
        #
        # A long-lived NPM_TOKEN is deliberately not used: npm is restricting tokens
        # that bypass 2FA for direct publishing, which is what broke the 0.1.2 attempt.
        # Lint and build run automatically as part of the release process.
        run: npm run release
